<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLUENT — Public Speaking & Communication Practice</title>
  <meta name="description" content="A clean, structured public speaking and technical explanation practice app for students and technology professionals.">
  
  <!-- PWA & Desktop App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FLUENT">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=3">
  <link rel="stylesheet" href="css/views.css?v=3">
</head>
<body>

  <div class="app-container">
    <!-- Desktop Sidebar Navigation -->
    <aside class="main-sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon" id="sidebar-logo"></div>
        <span class="brand-title">FLUENT</span>
      </div>
      
      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li>
            <button class="nav-item-btn active" data-view="home" id="nav-home">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span>Home</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="practice" id="nav-practice">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              <span>Practice</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="frameworks" id="nav-frameworks">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
              <span>Frameworks</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="vocabulary" id="nav-vocabulary">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              <span>Vocabulary</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="progress" id="nav-progress">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              <span>Progress</span>
            </button>
          </li>
          <li>
            <button class="nav-item-btn" data-view="profile" id="nav-profile">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span>Profile</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" id="header-user-btn">
          <div id="header-user-avatar" style="width: 32px; height: 32px; border-radius: 50%; background: var(--teal-badge); border: 1px solid var(--teal-border); color: var(--primary-teal-dark); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;">
            S
          </div>
          <span id="header-greeting" style="font-weight: 600; color: var(--text-main);">Good morning, Speaker</span>
        </div>

        <div class="header-right" style="display: flex; align-items: center; gap: 16px;">
          <div id="streak-badge" class="badge badge-teal" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span id="streak-count">Start Streak 🔥</span>
          </div>
        </div>
      </header>

      <!-- Main Dynamic View Container -->
      <main class="view-content" id="app-view-container">
        <!-- Views rendered dynamically by app.js -->
      </main>
    </div>

    <!-- Mobile Bottom Fixed Navigation Bar -->
    <nav class="mobile-nav">
      <button class="mobile-nav-btn active" data-view="home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </button>
      <button class="mobile-nav-btn" data-view="practice">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
        <span>Practice</span>
      </button>
      <button class="mobile-nav-btn" data-view="frameworks">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        <span>Frameworks</span>
      </button>
      <button class="mobile-nav-btn" data-view="vocabulary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Vocab</span>
      </button>
      <button class="mobile-nav-btn" data-view="progress">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Progress</span>
      </button>
      <button class="mobile-nav-btn" data-view="profile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('FLUENT Service Worker Registered'))
          .catch(err => console.log('Service Worker Registration Status: ', err));
      });
    }
  </script>

  <!-- JS Modules -->
  <script src="js/logo.js?v=3"></script>
  <script src="js/storage.js?v=3"></script>
  <script src="js/topics.js?v=3"></script>
  <script src="js/frameworks.js?v=3"></script>
  <script src="js/vocabulary.js?v=3"></script>
  <script src="js/analyzer.js?v=3"></script>
  <script src="js/recording.js?v=3"></script>
  <script src="js/views/homeView.js?v=3"></script>
  <script src="js/views/practiceView.js?v=3"></script>
  <script src="js/views/frameworksView.js?v=3"></script>
  <script src="js/views/vocabularyView.js?v=3"></script>
  <script src="js/views/progressView.js?v=3"></script>
  <script src="js/views/historyView.js?v=3"></script>
  <script src="js/views/profileView.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
